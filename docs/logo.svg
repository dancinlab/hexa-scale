<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- hexa-scale signature: 6 nested regular flat-top hexagons (multiverse → city)
       with σφτ centre. Centred at (70, 70). Flat-top vertex offsets:
       (±r, 0) and (±r/2, ±r·√3/2). Width:height = 2:√3 ≈ 1.155 (wider than tall). -->
  <g fill="none" stroke="#bf8700" stroke-linejoin="round">
    <!-- scale 1: multiverse (outermost) — r=62 -->
    <polygon points="101,16.3 132,70 101,123.7 39,123.7 8,70 39,16.3" stroke-width="1.8"/>
    <!-- scale 2: universe — r=52 -->
    <polygon points="96,25 122,70 96,115 44,115 18,70 44,25" stroke-width="1.6"/>
    <!-- scale 3: galaxy — r=42 -->
    <polygon points="91,33.6 112,70 91,106.4 49,106.4 28,70 49,33.6" stroke-width="1.4"/>
    <!-- scale 4: planet — r=32 -->
    <polygon points="86,42.3 102,70 86,97.7 54,97.7 38,70 54,42.3" stroke-width="1.3"/>
    <!-- scale 5: country — r=22 -->
    <polygon points="81,50.9 92,70 81,89.1 59,89.1 48,70 59,50.9" stroke-width="1.2"/>
    <!-- scale 6: city (innermost) — r=12 -->
    <polygon points="76,59.6 82,70 76,80.4 64,80.4 58,70 64,59.6" stroke-width="1.2"/>
    <!-- centre node — σφτ identity -->
    <circle cx="70" cy="70" r="3" fill="#bf8700" stroke="none"/>
  </g>
  <!-- compact label below centre -->
  <text x="70" y="73" text-anchor="middle" font-family="ui-monospace, monospace" font-size="4.5" fill="#1a1d24" stroke="none">6×4</text>
</svg>
