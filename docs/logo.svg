<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- hexa-scale signature: 6 nested regular hexagons (multiverse → city) with σφτ centre.
       Pointy-top hexagons centred at (70, 70). Vertex offsets: (0, ±r), (±r·√3/2, ±r/2). -->
  <g fill="none" stroke="#bf8700" stroke-linejoin="round">
    <!-- scale 1: multiverse (outermost) — r=62 -->
    <polygon points="70,8 123.7,39 123.7,101 70,132 16.3,101 16.3,39" stroke-width="1.8"/>
    <!-- scale 2: universe — r=52 -->
    <polygon points="70,18 115,44 115,96 70,122 25,96 25,44" stroke-width="1.6"/>
    <!-- scale 3: galaxy — r=42 -->
    <polygon points="70,28 106.4,49 106.4,91 70,112 33.6,91 33.6,49" stroke-width="1.4"/>
    <!-- scale 4: planet — r=32 -->
    <polygon points="70,38 97.7,54 97.7,86 70,102 42.3,86 42.3,54" stroke-width="1.3"/>
    <!-- scale 5: country — r=22 -->
    <polygon points="70,48 89.1,59 89.1,81 70,92 51,81 51,59" stroke-width="1.2"/>
    <!-- scale 6: city (innermost) — r=12 -->
    <polygon points="70,58 80.4,64 80.4,76 70,82 59.6,76 59.6,64" stroke-width="1.2"/>
    <!-- centre node — σφτ identity -->
    <circle cx="70" cy="70" r="3" fill="#bf8700" stroke="none"/>
  </g>
  <!-- compact label below centre -->
  <text x="70" y="73" text-anchor="middle" font-family="ui-monospace, monospace" font-size="4.5" fill="#1a1d24" stroke="none">6×4</text>
</svg>
