<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="140" height="140">
  <!-- hexa-scale signature: 6 nested hexagons (multiverse → city) with σφτ centre -->
  <g fill="none" stroke="#bf8700" stroke-linejoin="round">
    <!-- scale 6: city (innermost) -->
    <polygon points="70,55 78,60 78,80 70,85 62,80 62,60" stroke-width="1.2"/>
    <!-- scale 5: country -->
    <polygon points="70,46 86,55 86,85 70,94 54,85 54,55" stroke-width="1.2"/>
    <!-- scale 4: planet -->
    <polygon points="70,36 94,50 94,90 70,104 46,90 46,50" stroke-width="1.3"/>
    <!-- scale 3: galaxy -->
    <polygon points="70,26 102,44 102,96 70,114 38,96 38,44" stroke-width="1.4"/>
    <!-- scale 2: universe -->
    <polygon points="70,16 110,38 110,102 70,124 30,102 30,38" stroke-width="1.6"/>
    <!-- scale 1: multiverse (outermost) -->
    <polygon points="70,6 118,32 118,108 70,134 22,108 22,32" stroke-width="1.8"/>
    <!-- centre node — σφτ -->
    <circle cx="70" cy="70" r="4" fill="#bf8700" stroke="none"/>
  </g>
  <!-- compact label below centre -->
  <text x="70" y="73" text-anchor="middle" font-family="ui-monospace, monospace" font-size="5.5" fill="#1a1d24" stroke="none">6×4</text>
</svg>
